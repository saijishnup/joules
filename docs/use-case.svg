<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Geist, system-ui, sans-serif" font-size="13">
  <title>Joules use-case diagram</title>
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <g id="actor"><circle cx="0" cy="-34" r="11" fill="none" stroke="#16181A" stroke-width="1.5"/><path d="M0 -23v28M-18 -10h36M0 5l-14 22M0 5l14 22" fill="none" stroke="#16181A" stroke-width="1.5"/></g>
  </defs>
  <rect x="220" y="20" width="460" height="520" rx="16" fill="#F6F9EC" stroke="#9BC400"/>
  <text x="450" y="46" text-anchor="middle" font-weight="600" font-size="15">Joules</text>
  <g fill="#ffffff" stroke="#16181A" stroke-width="1.2">
    <ellipse cx="450" cy="85" rx="150" ry="20"/><ellipse cx="450" cy="133" rx="150" ry="20"/>
    <ellipse cx="450" cy="181" rx="150" ry="20"/><ellipse cx="450" cy="229" rx="150" ry="20"/>
    <ellipse cx="450" cy="277" rx="150" ry="20"/><ellipse cx="450" cy="325" rx="150" ry="20"/>
    <ellipse cx="450" cy="373" rx="150" ry="20"/><ellipse cx="450" cy="421" rx="150" ry="20"/>
    <ellipse cx="450" cy="469" rx="150" ry="20"/><ellipse cx="450" cy="511" rx="150" ry="18"/>
  </g>
  <g text-anchor="middle">
    <text x="450" y="90">Sign in, pick a stakeholder role</text>
    <text x="450" y="138">Write brief, attach files (masked)</text>
    <text x="450" y="186">Answer interview cards</text>
    <text x="450" y="234">Review, edit, regenerate requirements</text>
    <text x="450" y="282">Resolve conflicts</text>
    <text x="450" y="330">Approve baseline (gate 1)</text>
    <text x="450" y="378">Adjust factor ratings, see ranking</text>
    <text x="450" y="426">Approve SDLC choice (gate 2)</text>
    <text x="450" y="474">Export one-page report, JSON</text>
    <text x="450" y="515">Read evaluation, terms, privacy</text>
  </g>
  <use href="#actor" x="90" y="180"/><text x="90" y="228" text-anchor="middle" font-weight="600">Stakeholder</text>
  <use href="#actor" x="90" y="420"/><text x="90" y="468" text-anchor="middle" font-weight="600">Approver</text>
  <use href="#actor" x="810" y="150"/><text x="810" y="198" text-anchor="middle" font-weight="600">Interviewer</text>
  <use href="#actor" x="810" y="290"/><text x="810" y="338" text-anchor="middle" font-weight="600">Analyst</text>
  <use href="#actor" x="810" y="430"/><text x="810" y="478" text-anchor="middle" font-weight="600">Planner</text>
  <text x="810" y="352" text-anchor="middle" fill="#6B7280" font-size="11">(LLM agents)</text>
  <g stroke="#6B7280" stroke-width="1">
    <line x1="112" y1="160" x2="300" y2="88"/><line x1="112" y1="165" x2="300" y2="135"/><line x1="112" y1="170" x2="300" y2="181"/>
    <line x1="112" y1="175" x2="300" y2="229"/><line x1="112" y1="180" x2="300" y2="277"/><line x1="112" y1="185" x2="300" y2="373"/>
    <line x1="112" y1="190" x2="300" y2="469"/><line x1="112" y1="195" x2="300" y2="511"/>
    <line x1="112" y1="405" x2="300" y2="325"/><line x1="112" y1="410" x2="300" y2="421"/>
    <line x1="788" y1="140" x2="600" y2="181"/>
    <line x1="788" y1="275" x2="600" y2="229"/><line x1="788" y1="280" x2="600" y2="277"/>
    <line x1="788" y1="420" x2="600" y2="373"/><line x1="788" y1="425" x2="600" y2="421"/>
  </g>
</svg>
